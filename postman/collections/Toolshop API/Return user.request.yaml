$kind: http-request
url: "{{baseUrl}}/users/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns the new user', () => {
          pm.expect(pm.response.json().email).to.eql(pm.collectionVariables.get('email'));
      })
    language: text/javascript
order: 4000
