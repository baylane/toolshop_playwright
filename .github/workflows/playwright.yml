name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Lint and type check
      run: npm run lint && npm run typecheck
    - name: Start the Toolshop
      env:
        SPRINT: sprint5
      run: |
        git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git toolshop-app
        cd toolshop-app
        docker build -t testsmith/practice-software-testing-web -f _docker/web.docker _docker
        docker compose -f docker-compose.prod.yml up -d --scale cron=0
        npx --yes wait-on --timeout 300000 http-get://localhost:8091/status http-get://localhost:4200
        for i in 1 2 3 4 5; do
          docker compose -f docker-compose.prod.yml exec -T laravel-api php artisan migrate:fresh --seed && break
          sleep 15
        done
        curl --fail --silent --show-error http://localhost:8091/products > /dev/null
    - name: Run Playwright tests
      run: npm run test:local
    - uses: grafana/setup-k6-action@v1
      if: ${{ !cancelled() }}
    - name: Performance check
      if: ${{ !cancelled() }}
      env:
        K6_WEB_DASHBOARD: true
        K6_WEB_DASHBOARD_PERIOD: 2s
        K6_WEB_DASHBOARD_EXPORT: playwright-report/k6-report.html
      run: k6 run perf/products.js
    - name: Run Postman collection
      if: ${{ !cancelled() }}
      run: npx postman collection run "postman/collections/Toolshop API" -e "postman/environments/Local.environment.yaml"
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-pages-artifact@v5
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
      with:
        path: playwright-report/
  publish-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5